<header data-bs-theme="dark">
    <div class="collapse text-bg-dark" id="navbarHeader">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center py-4 gap-4 flex-wrap">
                <div>
                    <h5 class="mb-1">Магазин</h5>
                    <a href="{% url 'catalog:product_list' %}" class="text-white">Камни и руны</a>
                </div>
                <div>
                    <h5 class="mb-1">Блог</h5>
                    <a href="{% url 'blogera:post_list' %}" class="text-white">Мой курган</a>
                </div>
                <div class="d-flex gap-3 align-items-center">
                    {% if user.is_authenticated %}
                        <form action="{% url 'users:logout' %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link text-white p-0">Выйти</button>
                        </form>
                    {% else %}
                        <a href="{% url 'users:login' %}" class="text-white">Войти</a>
                        <form action="{% url 'users:register' %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link text-white p-0">Зарегистрироваться</button>
                        </form>
                    {% endif %}
                </div>
                <div>
                    <h5 class="mb-1">Контакты</h5>
                    <a href="{% url 'catalog:contacts' %}" class="text-white">Свяжитесь с нами</a>
                </div>

            </div>
        </div>
    </div>
    <div class="navbar navbar-dark bg-dark shadow-sm">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarHeader" aria-controls="navbarHeader"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</header>
