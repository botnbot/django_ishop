{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Добавить свой камень</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-secondary">Положить</button>
        {% if user.is_authenticated and post.author == user %}
        <a href="{% url 'blogera:post_list' %}" class="btn btn-secondary">Забрать</a>
        {% endif %}
    </form>
</div>
{% endblock %}
