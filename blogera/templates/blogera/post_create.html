{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Добавить свой камень</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success">Положить</button>
        <a href="{% url 'blogera:post_list' %}" class="btn btn-secondary">Забрать</a>
    </form>
</div>
{% endblock %}
