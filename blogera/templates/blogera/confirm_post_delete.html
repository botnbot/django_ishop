{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Удалить пост?</h1>

    <p>Вы уверены, что хотите удалить: <strong>{{ post.title }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blogera:post_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
