{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Форма для удаления продукта</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
<div class="container">
    <h1 class="mb3">Удаление продукта</h1>
    <p>Вы действительно хотите удалить продукт: {{ object.name }}?</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p}}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'catalog:product_list' %}">Отмена</a>

    </form>
</div>
    <script type="text/javascript" src="{% static 'js/bootstrap.bundle.min.js'%}"></script>
</body>
</html>
