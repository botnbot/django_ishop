{% if widget.is_initial %}
    <div class="current-image mb-2">
        <p>Текущее изображение:</p>
        <img src="{{ widget.value.url }}" width="200" class="img-thumbnail">
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="{{ widget.clear_checkbox_name }}" id="{{ widget.clear_checkbox_id }}">
        <label class="form-check-label" for="{{ widget.clear_checkbox_id }}">
            Удалить текущее изображение
        </label>
    </div>
{% endif %}

<div class="mb-3">
    {{ widget.input_text }}:
    <input type="{{ widget.type }}" name="{{ widget.name }}" class="form-control-file" {% include "django/forms/widgets/attrs.html" %}>
</div>
